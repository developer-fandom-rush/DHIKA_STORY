name: Import original Ankita 04B Google Doc images
on:
  push:
    branches: [main]
    paths:
      - 'Society-Wives/ankita-04b-image-import.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ankita-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Import four original document illustrations
        run: python Society-Wives/tools/import_ankita_04b_doc_images.py
      - name: Commit permanent image files and completed manifest
        shell: bash
        run: |
          grep -q '"status": "completed"' Society-Wives/ankita-04b-image-import.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Society-Wives/assets/episode-04b-ankita/ Society-Wives/ankita-04b-image-import.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(ankita 04B): import original Google Doc illustrations"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Failed to publish original illustrations"
          exit 1
