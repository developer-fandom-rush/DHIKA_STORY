name: Society Wives UI — PR verification
on:
  pull_request:
    paths:
      - 'Society-Wives/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/society-wives-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: Society-Wives/ui
      - name: Verify source integrity
        run: npm run test
        working-directory: Society-Wives/ui
      - name: Compile React TypeScript app
        run: npm run build
        working-directory: Society-Wives/ui
      - name: Upload staged preview build
        uses: actions/upload-artifact@v4
        with:
          name: society-wives-unified-preview
          path: Society-Wives/ui/dist
