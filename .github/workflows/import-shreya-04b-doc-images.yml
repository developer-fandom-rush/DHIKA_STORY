name: Import original Shreya 04B Google Doc inline images
on:
  push:
    branches: [main]
    paths:
      - 'Society-Wives/shreya-04b-image-import.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Transfer original Shreya images in exact Google Doc order
        run: python Society-Wives/tools/import_shreya_04b_doc_images.py
      - name: Commit original image assets and updated reader data
        shell: bash
        run: |
          if ! grep -q '"status": "completed"' Society-Wives/shreya-04b-image-import.json; then
            echo 'Original asset import incomplete'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Society-Wives/assets/episode-04b-shreya/ Society-Wives/episode-04b-shreya-source.json Society-Wives/shreya-04b-image-import.json
          if git diff --cached --quiet; then
            echo 'No new assets'
            exit 0
          fi
          git commit -m "assets(shreya 04B): import 9 original Google Doc images"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Shreya originals committed to main'
              exit 0
            fi
            sleep 3
          done
          echo 'Could not publish image originals'
          exit 1
