name: Deploy Story Intelligence to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify archive and JavaScript
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/corpus.json').read_text(encoding='utf-8'))
          assert len(d['episodes'])==41, 'Expected 41 episodes'
          assert sum(len(e['lines']) for e in d['episodes'])==10450, 'Expected 10,450 source paragraphs'
          assert sum(e['parts'] for e in d['episodes'])==55, 'Expected 55 source parts'
          assert all(e['lines'] for e in d['episodes']), 'Empty episode!'
          assert all(Path(x).exists() for x in ('index.html','styles.css','app.js'))
          print('Verified 41 episodes, 10,450 paragraphs, 55 parts.')
          PY
          python tests/validate_archive.py

      - name: Build and verify unified Society Wives UI
        shell: bash
        run: |
          cd Society-Wives/ui
          npm install --no-audit --no-fund
          npm run test
          npm run build

      - name: Install browser for visual smoke tests
        shell: bash
        run: |
          cd Society-Wives/ui
          npx playwright install chromium --with-deps

      - name: Test character library, gallery, reader, and mobile UI in Chromium
        shell: bash
        run: |
          # The source-backed Dhika reader is embedded from the repository root.
          mkdir -p .preview-site/DHIKA_STORY/data
          cp index.html app.js styles.css .preview-site/DHIKA_STORY/
          cp data/corpus.json data/pair_evidence_v2.json .preview-site/DHIKA_STORY/data/
          mkdir -p .preview-site/DHIKA_STORY/Society-Wives
          rsync -a --exclude='/ui/' Society-Wives/ .preview-site/DHIKA_STORY/Society-Wives/
          cp -a Society-Wives/ui/dist/. .preview-site/DHIKA_STORY/Society-Wives/
          python3 -m http.server 4173 --directory .preview-site > /tmp/sw-ui-preview-server.log 2>&1 &
          sleep 2
          cd Society-Wives/ui
          npm run test:browser

      - name: Upload UI smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: society-wives-live-ui-browser-screens
          path: Society-Wives/ui/test-screenshots

      # The deployed Pages artifact already uses the Vite build. Keep the committed
      # entrypoint and compiled assets in sync too, so branch-based Pages and direct
      # links cannot silently serve the previous Series Library HTML.
      - name: Sync built Society Wives entrypoint to main
        shell: bash
        run: |
          mkdir -p Society-Wives/assets
          find Society-Wives/assets -maxdepth 1 -type f -name 'index-*.js' -delete
          find Society-Wives/assets -maxdepth 1 -type f -name 'index-*.css' -delete
          cp Society-Wives/ui/dist/index.html Society-Wives/index.html
          cp -a Society-Wives/ui/dist/assets/. Society-Wives/assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Society-Wives/index.html Society-Wives/assets/
          if ! git diff --cached --quiet; then
            git commit -m "fix(pages): sync built Society Wives reader into source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/corpus.json _site/data/
          cp -r Society-Wives _site/
          cp -r Society-Wives/ui/dist/. _site/Society-Wives/
          rm -rf _site/Society-Wives/ui/node_modules _site/Society-Wives/ui/dist
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
